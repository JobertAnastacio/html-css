<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html5</title>
</head>
<body>
    <h1>imagens dinâmicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes, ou siplesmente aumente ou diminua o zoom</p>
    <picture>
        <source media="(max-width: 710px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="Imagem flexivel">
    </picture>
    <h1>reproduzindo audios</h1>
    <p>Vamos agora aprender a rerpoduzir audios</p>
    <audio src="midia/happy-mistake.mp3" controls autoplay> </audio>
    <!-- mp3 wav ogg-->
     <hr>
     <h2>Outra forma de reproduzir audios</h2>
     <audio preload="metadata" controls>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        <p>infelizmente seu navegador não consegue reproduzir audios <a href="midia/guanacast-33.mp3"> clique aqui para baixar o audio</a></p>
     </audio>
     
</body>
</html>
