<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes exterrnas</title>
    <style>
        @font-face {
            font-family: 'united';
            src: url('fontes/unitedcolony.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to left,rgb(182, 189, 253),rgb(83, 81, 202),rgb(25, 0, 255));
        }
        h1{
            font-family: 'united', Times, serif;
            font-size: 3em;
            font-weight: normal;
            color: white;
        }
        p{
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Non voluptatem itaque tempore numquam vitae quod molestiae fugiat deserunt error porro! Dicta, labore fugit. Amet deserunt maiores est animi porro molestias?</p>
</body>
</html>
