<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style>
        div.conteiner {
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: row wrap;
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            flex: auto;

            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it"> Exemplo de Bloco A</div>
        <div class="it"> Exemplo de Bloco B</div>
        <div class="it"> Exemplo de Bloco C</div>
        <div class="it"> Exemplo de Bloco D</div>
        <div class="it"> Exemplo de Bloco E</div>
        <div class="it"> Exemplo de Bloco F</div>
        <div class="it"> Exemplo de Bloco G</div>
    </div>
</body>
</html>
