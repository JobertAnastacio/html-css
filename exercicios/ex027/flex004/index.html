<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style>
        div.conteiner {
            background-color: rgb(0, 0, 0);
            height: 300px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: center;
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it">A</div>
        <div class="it">B</div>
        <div class="it">C</div>
        <div class="it">D</div>
        <div class="it">E</div>
        <div class="it">F</div>
        <div class="it">G</div>
    </div>
</body>
</html>
