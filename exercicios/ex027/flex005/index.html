<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: black;
        }
        main{
            background-color: rgb(23, 87, 65);
            height: 90vh;
            width: 90vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: rgb(4, 46, 46);
            padding: 10px;
            height: 300px;
            width: 300px;
            border-radius: 10px;
            margin: auto;
            
            
        }
        h1{
            color: beige;
            text-align: center;
            padding: 10px;
            margin-bottom: 5px;
            
        }
        label{
            background-color: rgb(12, 104, 104);
            text-align: center;
            width: 70px;
            padding: 5px;
            display: block;
            margin-left: 14px;
            margin-bottom: 7px;
            font-weight: bold;
            color: white;
        }
        #igmail{
            border-style: none;
            display: block;
            margin: auto;
            height: 30px;
            width: 90%;
            margin-bottom: 15px;
        }
        #isenha{
            border-style: none;
            margin: auto;
            display: block;
            height: 30px;
            width: 90%;
            margin-bottom: 15px;
        }
        section input[type=submit]{
            display: block;
            text-align: center;
            margin: auto;
            height: 30px;
            width: 50%;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
            <form action="">
                <label for="igmail">Usuário</label>
                <input type="email" name="gmail" id="igmail">
                <label for="isenha">Senha</label>
                <input type="password" name="senha" id="isenha">
                <input type="submit" value="Enviar" id="enviar">
            </form>
        </section>
    </main>
</body>
</html>
