<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style>
        div.conteiner {
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: row wrap;
            height: 400px;
            justify-content: center;
            align-content: space-between;
            
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            padding: 50px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it">A</div>
        <div class="it">B</div>
        <div class="it">C</div>
        <div class="it">D</div>
        <div class="it">E</div>
        <div class="it">F</div>
        <div class="it">G</div>
        <div class="it">H</div>
        <div class="it">I</div>
        <div class="it">J</div>
        <div class="it">K</div>
        <div class="it">L</div>
    </div>
</body>
</html>
