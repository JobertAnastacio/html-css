<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style> 
        :root{
            --principal: red;
        }
        div.conteiner {
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: row nowrap;
    
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 0;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it">A</div>
        <div class="it">Bbbbbbbbb</div>
        <div class="it">C</div>
        <div class="it">D</div>
        <div class="it">Eeeeeeeeeeeeeeeeeee</div>
        <div class="it">Ffffff</div>
        <div class="it">Ggggggggggggg</div>
    </div>
</body>
</html>
