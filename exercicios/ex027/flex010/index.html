<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style>
        div.conteiner {
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: row nowrap;
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it">A</div>
        <div class="it">B</div>
        <div class="it">C</div>
       
    </div>
</body>
</html>
