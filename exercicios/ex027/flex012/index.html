<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibel BOX</title>
    <style>
        div.conteiner {
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: row nowrap;
        }   
        div.it {
            background-color: rgb(1, 119, 255);
            border: 1px solid black;
            text-align: center;
            
        }
        div#caxA{ 
            flex: 1 0 200px;
            /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;  */
        }
        div#caxB{
            flex: 0 1 200px;
            /* flex-shrink: 1;
            flex-grow:0;
            flex-basis: 200px;  */
        }
        div#caxC{
            flex: 3 2 200px;
            /* flex-shrink: 2;
            flex-grow: 3;
            flex-basis: 200px;  */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="it" id="caxA">A</div>
        <div class="it" id="caxB">B</div>
        <div class="it" id="caxC">C</div>
       
    </div>
</body>
</html>
