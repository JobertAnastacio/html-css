<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        div#container{
            display: grid;
            grid-template:1fr 0.5fr 3fr 0.5fr/ 1fr 2fr 1fr;
            width: 100vw;
            height: 100vh;
        }
        div.item1{
            background-color: rgb(0, 0, 0);
            text-align: center;
            grid-area: 1/1/2/-1;
        }
        div.item2{
            background-color: rgb(39, 39, 39);
            grid-area: 2/1/3/-1;
            text-align: center;
        }
        div.item3{
            background-color: rgb(194, 194, 194);
            grid-area: 3/1/4/3;
            text-align: center;
        }
        div.item4{
            background-color: rgb(39, 39, 39);
            grid-area: 3/3/4/4;
            text-align: center;
        }
        div.item5{
            background-color: rgb(0, 0, 0);
            grid-area: 4/1/5/4;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item1">Topo</div>
        <div class="item2">Menu</div>
        <div class="item3">Principal</div>
        <div class="item4">Secundario</div>
        <div class="item5">Rodape</div>
    </div>
</body>
</html>
